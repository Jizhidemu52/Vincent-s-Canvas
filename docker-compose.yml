services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: wireless-canvas-web:local
    container_name: wireless-canvas-web
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  api:
    image: ${CANVAS_API_IMAGE:-wireless-canvas-api:local}
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: .env
    environment:
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      OA_LOGIN_ENABLED: ${OA_LOGIN_ENABLED:-false}
      DATABASE_URL: postgres://wireless_canvas:${POSTGRES_PASSWORD}@postgres:5432/wireless_canvas
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3100/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  worker:
    image: ${CANVAS_API_IMAGE:-wireless-canvas-api:local}
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["bun", "src/worker.ts"]
    stop_grace_period: 21m
    env_file: .env
    environment:
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      OA_LOGIN_ENABLED: ${OA_LOGIN_ENABLED:-false}
      WORKER_SHUTDOWN_GRACE_SECONDS: ${WORKER_SHUTDOWN_GRACE_SECONDS:-1200}
      DATABASE_URL: postgres://wireless_canvas:${POSTGRES_PASSWORD}@postgres:5432/wireless_canvas
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wireless_canvas
      POSTGRES_USER: wireless_canvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wireless_canvas"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    build:
      context: .
      dockerfile: ops/minio/Dockerfile
      target: minio
    image: wireless-canvas-minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: build
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio-init:
    build:
      context: .
      dockerfile: ops/minio/Dockerfile
      target: mc
    image: wireless-canvas-mc:RELEASE.2025-04-16T18-13-26Z
    pull_policy: build
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY && mc mb --ignore-existing local/$$S3_BUCKET && mc version enable local/$$S3_BUCKET"]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-wireless-canvas}
  backup:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    environment:
      DATABASE_URL: postgres://wireless_canvas:${POSTGRES_PASSWORD}@postgres:5432/wireless_canvas
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-wireless-canvas}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?Configure an independent backup endpoint}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?Configure a dedicated backup bucket}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?Configure backup credentials}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?Configure backup credentials}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?Configure the offline age public recipient}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-canvas}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-900}
      BACKUP_FAILURE_WEBHOOK_URL: ${BACKUP_FAILURE_WEBHOOK_URL:-}
    depends_on:
      api:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  minio-data:
