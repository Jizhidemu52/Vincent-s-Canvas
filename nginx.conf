# The OA entry carries a short-lived token in its query string. Do not log query
# parameters or Referer headers, even before the browser removes the token.
log_format canvas_safe '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent';

map $uri $static_cache_control {
    default "no-cache";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+$" "public, max-age=31536000, immutable";
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log canvas_safe;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Chat can wait up to 180s for the provider; every proxy hop must allow it.
    location = /api/chat/responses {
        client_max_body_size 200m;
        proxy_pass http://api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_buffering off;
        # A model POST may already be billable; never replay it at the proxy.
        proxy_next_upstream off;
    }

    location /api/ {
        client_max_body_size 200m;
        proxy_pass http://api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    # The asset-library SPA route shares its name with the static asset directory.
    location = /assets {
        rewrite ^ /index.html last;
    }

    location = /assets/ {
        rewrite ^ /index.html last;
    }

    location ^~ /assets/ {
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Do not cache missing assets for a year; only successful fingerprinted files are immutable.
        add_header Cache-Control $static_cache_control;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
