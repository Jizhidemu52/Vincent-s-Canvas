# The OA entry carries a short-lived token in its query string. Do not log query
# parameters or Referer headers, even before the browser removes the token.
log_format canvas_safe '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent';

map $uri $static_cache_control {
    default "no-cache";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+$" "public, max-age=31536000, immutable";
}

# The outer proxy terminates TLS. Only the two valid schemes are forwarded;
# container Web ports must remain private behind that trusted proxy.
map $http_x_forwarded_proto $canvas_forwarded_proto {
    default $scheme;
    "http" http;
    "https" https;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Module workers require a JavaScript MIME type. Keep the stock mappings
    # when extending them, including for the previous-release asset fallback.
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    access_log /var/log/nginx/access.log canvas_safe;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Chat can wait up to 180s for the provider; every proxy hop must allow it.
    location = /api/chat/responses {
        client_max_body_size 200m;
        proxy_pass http://api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_buffering off;
        # A model POST may already be billable; never replay it at the proxy.
        proxy_next_upstream off;
    }

    # One shared task notification stream per workspace; heartbeat keeps it live.
    location = /api/tasks/events {
        proxy_pass http://api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
        proxy_read_timeout 75s;
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        gzip off;
    }

    # Unsigned reference tokens must not be written to access logs or cached.
    location /api/provider-images/ {
        access_log off;
        error_log /dev/null crit;
        expires off;
        proxy_pass http://api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_store off;
        proxy_intercept_errors off;
        proxy_next_upstream off;
        gzip off;
    }

    location /api/ {
        client_max_body_size 200m;
        proxy_pass http://api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_next_upstream off;
    }

    location = /index.html {
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    # The asset-library SPA route shares its name with the static asset directory.
    location = /assets {
        rewrite ^ /index.html last;
    }

    location = /assets/ {
        rewrite ^ /index.html last;
    }

    location ^~ /assets/ {
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Do not cache missing assets for a year; only successful fingerprinted files are immutable.
        add_header Cache-Control $static_cache_control;
        try_files $uri @previous_assets;
    }

    # A clean image contains only this release. The deployer may mount the
    # previous release's public fingerprinted assets read-only, so a long-lived
    # editor can finish saving before reloading. No index, maps or config here.
    location @previous_assets {
        root /opt/canvas/previous-public;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control $static_cache_control;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
