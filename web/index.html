<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta name="referrer" content="no-referrer" />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="TruCreate · AI 创意设计平台。Ideas Come True. 想法成真" />
        <link rel="icon" href="/logo.svg" />
        <title>TruCreate · AI 创意设计平台</title>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("wireless-canvas:theme_store") || "{}");
                var t = s.state && s.state.theme === "dark" ? "dark" : "light";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
