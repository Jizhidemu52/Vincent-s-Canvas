# Include inside the existing Baota site server block. Preserve its certificate,
# access restrictions and OA-safe access_log; remove competing proxy locations.
# This is the only deployment-specific value; the upstream must stay loopback.
set $canvas_web http://127.0.0.1:3000;

client_max_body_size 200m;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;

location = /api/chat/responses {
    proxy_pass $canvas_web;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
}

location = /api/tasks/events {
    proxy_pass $canvas_web;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    gzip off;
}

# Keep the site's existing access controls; external reachability must be
# explicitly configured for this path without opening employee API routes.
location /api/provider-images/ {
    access_log off;
    error_log /dev/null crit;
    expires off;
    proxy_pass $canvas_web;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_store off;
    proxy_intercept_errors off;
    proxy_next_upstream off;
    gzip off;
}

location /api/ {
    proxy_pass $canvas_web;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_cache off;
    proxy_next_upstream off;
}

location / {
    proxy_pass $canvas_web;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream off;
}
